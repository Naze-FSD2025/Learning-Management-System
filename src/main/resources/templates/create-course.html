<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<div class="max-w-4xl mx-auto py-10 px-4">

    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">

        <div class="bg-indigo-600 p-6 text-white">
            <h1 class="text-3xl font-bold">📚 Create New Course</h1>
            <p class="opacity-90 mt-1">
                Create and publish learning content for students
            </p>
        </div>

        <form action="/instructor/course/create"
              method="post"
              class="p-8 space-y-6">

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Course Title
                </label>

                <input
                        type="text"
                        name="title"
                        placeholder="Java Full Stack Development"
                        required
                        class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Description
                </label>

                <textarea
                        name="description"
                        rows="6"
                        placeholder="Enter course description..."
                        required
                        class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
            </div>

            <div class="flex gap-4">

                <button
                        type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg shadow">
                    Create Course
                </button>

                <a href="/instructor/dashboard"
                   class="bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-lg">
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
