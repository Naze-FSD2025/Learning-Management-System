<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload File</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<div class="max-w-3xl mx-auto py-12 px-4">

    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">

        <div class="bg-green-600 p-6 text-white">
            <h1 class="text-3xl font-bold">📁 Upload Course Material</h1>
            <p class="mt-1 opacity-90">
                Upload PDFs, notes and learning resources
            </p>
        </div>

        <form
                action="/instructor/upload"
                method="post"
                enctype="multipart/form-data"
                class="p-8">

            <div class="border-2 border-dashed border-gray-300 rounded-xl p-10 text-center">

                <div class="text-6xl mb-4">
                    📄
                </div>

                <p class="text-gray-600 mb-4">
                    Select a PDF or course material
                </p>

                <input
                        type="file"
                        name="file"
                        required
                        class="block mx-auto">
            </div>

            <div class="mt-8 flex gap-4 justify-center">

                <button
                        type="submit"
                        class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg shadow">
                    Upload File
                </button>

                <a href="/instructor/files"
                   class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg shadow">
                    View Files
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
