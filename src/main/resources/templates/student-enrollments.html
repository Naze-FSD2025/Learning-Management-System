<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Enrollments</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-4xl mx-auto mt-10">
    <a href="/student/dashboard"
       class="bg-gray-600 text-white px-4 py-2 rounded inline-block mb-4">
        ← Dashboard
    </a>

    <h1 class="text-3xl font-bold mb-6">
        My Enrollments
    </h1>
    <p class="text-gray-500 mt-2"
       th:text="'Total Courses Enrolled: ' + ${enrollments.size()}">
    </p>
    <div th:each="enrollment : ${enrollments}"
         class="bg-white shadow rounded-xl p-6 mb-4">

        <h3 class="text-xl font-bold"
            th:text="${enrollment.course.title}">
        </h3>

        <p class="text-gray-600 mt-2"
           th:text="${enrollment.course.description}">
        </p>

        <a th:href="@{/student/course/{id}(id=${enrollment.course.id})}"
           class="bg-blue-600 text-white px-4 py-2 rounded mt-3 inline-block">
            View Lessons
        </a>

    </div>

</div>

</body>
</html>
