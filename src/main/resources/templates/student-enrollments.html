<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Enrollments</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<nav class="bg-green-600 text-white shadow">
    <div class="container mx-auto px-6 py-4 flex justify-between">

        <h1 class="text-2xl font-bold">
            My Enrollments
        </h1>

        <a href="/student/dashboard"
           class="bg-white text-green-600 px-4 py-2 rounded-lg font-semibold">
            Dashboard
        </a>

    </div>
</nav>

<div class="container mx-auto px-6 py-10">

    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

        <table class="w-full">

            <thead class="bg-green-600 text-white">

            <tr>
                <th class="p-4 text-left">Course</th>
                <th class="p-4 text-left">Status</th>
                <th class="p-4 text-left">Action</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="enrollment : ${enrollments}"
                class="border-b hover:bg-gray-50">

                <td class="p-4"
                    th:text="${enrollment.course.title}">
                </td>

                <td class="p-4">
                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full">
                        Enrolled
                    </span>
                </td>

                <td class="p-4">

                    <a th:href="@{/student/course/{id}(id=${enrollment.course.id})}"
                       class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                        View Lessons
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
