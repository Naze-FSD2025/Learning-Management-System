<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Lessons</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- Navbar -->
<nav class="bg-blue-600 text-white shadow">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">

        <h1 class="text-2xl font-bold">
            LMS Student Portal
        </h1>

        <a href="/student/dashboard"
           class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100">
            Dashboard
        </a>

    </div>
</nav>

<div class="container mx-auto px-6 py-10">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:justify-between md:items-center mb-8">

        <div>
            <h1 class="text-4xl font-bold text-gray-800">
                Course Lessons
            </h1>

            <p class="text-gray-500 mt-2">
                Complete lessons and track your learning progress.
            </p>
        </div>

        <!-- Progress Button -->
        <div th:if="${!#lists.isEmpty(lessons)}">

            <a th:href="@{/student/progress/{courseId}(courseId=${lessons[0].course.id})}"
               class="mt-4 md:mt-0 bg-purple-600 hover:bg-purple-700 text-white px-5 py-3 rounded-lg shadow">
                📈 View Progress
            </a>

        </div>

    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(lessons)}"
         class="bg-white rounded-2xl shadow-lg p-10 text-center">

        <h2 class="text-2xl font-bold text-gray-700 mb-3">
            No Lessons Available
        </h2>

        <p class="text-gray-500">
            Lessons will appear here when the instructor adds content.
        </p>

    </div>

    <!-- Lesson Cards -->
    <div class="space-y-6">

        <div th:each="lesson : ${lessons}"
             class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-xl transition">

            <!-- Lesson Header -->
            <div class="flex justify-between items-start mb-4">

                <div>

                    <h2 class="text-2xl font-bold text-gray-800"
                        th:text="${lesson.title}">
                    </h2>

                    <p class="text-gray-600 mt-3"
                       th:text="${lesson.content}">
                    </p>

                </div>

            </div>

            <!-- Resource Buttons -->
            <div class="flex flex-wrap gap-3 mt-5">

                <a th:href="${lesson.videoUrl}"
                   target="_blank"
                   class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow">

                    ▶ Watch Video

                </a>

                <a th:href="${lesson.pdfUrl}"
                   target="_blank"
                   class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow">

                    📄 Open PDF

                </a>

            </div>

            <!-- Complete Lesson -->
            <div class="mt-6 pt-4 border-t">

                <form th:action="@{/student/lesson/{id}/complete(id=${lesson.id})}"
                      method="post">

                    <input type="hidden"
                           name="courseId"
                           th:value="${lesson.course.id}"/>

                    <button type="submit"
                            class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg shadow">

                        ✔ Complete Lesson

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<footer class="mt-12 bg-white border-t py-4 text-center text-gray-500">

    © 2026 Learning Management System

</footer>

</body>
</html>
