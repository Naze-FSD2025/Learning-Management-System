<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>LMS Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

<div class="bg-white rounded-2xl shadow-xl overflow-hidden max-w-5xl w-full">

    <div class="grid md:grid-cols-2">

        <!-- Left Image -->
        <div class="hidden md:flex items-center justify-center bg-blue-50 p-8">

            <img th:src="@{/uploads/images/Learning-Login.png}"
                 alt="Learning Illustration"
                 class="w-full max-w-md">

        </div>

        <!-- Right Login Form -->
        <div class="p-10">

            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-blue-600">
                    LMS Portal
                </h1>

                <p class="text-gray-500 mt-2">
                    Sign in to your account
                </p>
            </div>

            <!-- Error Message -->
            <div th:if="${param.error}"
                 class="bg-red-100 text-red-700 p-3 rounded-lg mb-4">

                Invalid email or password

            </div>

            <!-- Logout Message -->
            <div th:if="${param.logout}"
                 class="bg-green-100 text-green-700 p-3 rounded-lg mb-4">

                Logged out successfully

            </div>

            <!-- Reset Link Sent Message -->
            <div th:if="${param.resetSent}"
                 class="bg-green-100 text-green-700 p-3 rounded mb-4">
                Password reset link has been sent to your email.
            </div>

            <form action="/login"
                  method="post"
                  class="space-y-5">

                <div>
                    <label class="block text-gray-700 mb-2">
                        Email
                    </label>

                    <input
                            type="email"
                            name="username"
                            placeholder="Enter your email"
                            required
                            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">
                        Password
                    </label>

                    <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Forgot Password -->
                <div class="text-right">
                    <a th:href="@{/forgot-password}"
                       class="text-blue-600 text-sm hover:underline">
                        Forgot Password?
                    </a>
                </div>

                <button
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition">

                    Login

                </button>

            </form>

            <div class="text-center mt-6">
                <p class="text-gray-600">

                    Don't have an account?

                    <a th:href="@{/register}"
                       class="text-blue-600 font-semibold hover:underline">

                        Register

                    </a>

                </p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
