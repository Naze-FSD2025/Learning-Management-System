<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Lesson</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<div class="max-w-4xl mx-auto py-10 px-4">

    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6">
            <h1 class="text-3xl font-bold">
                🎓 Add New Lesson
            </h1>

            <p class="mt-2 opacity-90">
                Create lesson content, videos and study materials
            </p>
        </div>

        <!-- Form -->
        <form method="post"
              class="p-8 space-y-6">

            <!-- Lesson Title -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Lesson Title
                </label>

                <input
                        type="text"
                        name="title"
                        placeholder="Introduction to Spring Boot"
                        required
                        class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <!-- Lesson Content -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Lesson Content
                </label>

                <textarea
                        name="content"
                        rows="6"
                        placeholder="Explain lesson objectives, concepts and notes..."
                        required
                        class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
            </div>

            <!-- Video URL -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    🎥 Video URL
                </label>

                <input
                        type="url"
                        name="videoUrl"
                        placeholder="https://youtube.com/..."
                        class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <!-- PDF URL -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    📄 PDF URL
                </label>

                <input
                        type="url"
                        name="pdfUrl"
                        placeholder="https://example.com/course-notes.pdf"
                        class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <!-- Buttons -->
            <div class="flex gap-4">

                <button
                        type="submit"
                        class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg shadow">
                    Add Lesson
                </button>

                <a href="/instructor/dashboard"
                   class="bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-lg">
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
