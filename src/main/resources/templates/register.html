<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

<div class="bg-white rounded-2xl shadow-xl overflow-hidden max-w-5xl w-full">

    <div class="grid md:grid-cols-2">

        <!-- Left Side Image -->
        <div class="hidden md:flex items-center justify-center bg-green-50 p-8">

            <img th:src="@{/uploads/images/Register.png}"
                 alt="Register Illustration"
                 class="w-full max-w-md">

        </div>

        <!-- Right Side Form -->
        <div class="p-10">

            <h2 class="text-4xl font-bold text-green-600 text-center mb-8">
                Create Account
            </h2>

            <form th:action="@{/register}" method="post">

                <div class="mb-4">
                    <input
                            type="text"
                            name="name"
                            placeholder="Full Name"
                            required
                            class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div class="mb-4">
                    <input
                            type="email"
                            name="email"
                            placeholder="Email Address"
                            required
                            class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div class="mb-4">
                    <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                            class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div class="mb-6">
                    <select
                            name="role"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">

                        <option value="STUDENT">Student</option>
                        <option value="INSTRUCTOR">Instructor</option>

                    </select>
                </div>

                <button
                        type="submit"
                        class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold hover:bg-green-700 transition">

                    Register

                </button>

            </form>

            <div class="text-center mt-6">

                <a th:href="@{/login}"
                   class="text-blue-600 hover:underline">

                    Already have an account? Login

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
