<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-6xl mx-auto py-8 px-4">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">
                📁 File Manager
            </h1>
            <p class="text-gray-500">
                Manage your uploaded course materials
            </p>
        </div>

        <a href="/instructor/upload"
           class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg shadow">
            + Upload File
        </a>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">

        <table class="w-full">

            <thead class="bg-indigo-600 text-white">
            <tr>
                <th class="p-4 text-left">ID</th>
                <th class="p-4 text-left">File Name</th>
                <th class="p-4 text-center">Download</th>
                <th class="p-4 text-center">Delete</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="file : ${files}"
                class="border-b hover:bg-gray-50 transition">

                <td class="p-4"
                    th:text="${file.id}">
                </td>

                <td class="p-4">
                    <div class="flex items-center gap-3">

                        <span class="text-2xl">📄</span>

                        <div>
                            <p class="font-medium text-gray-800"
                               th:text="${file.fileName}">
                            </p>

                            <p class="text-sm text-gray-500">
                                Course Material
                            </p>
                        </div>

                    </div>
                </td>

                <td class="p-4 text-center">

                    <a th:href="@{/media/download/{id}(id=${file.id})}"
                       class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                        Download
                    </a>

                </td>

                <td class="p-4 text-center">

                    <form th:action="@{/instructor/files/delete/{id}(id=${file.id})}"
                          method="post">

                        <button
                                onclick="return confirm('Delete this file?')"
                                class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
