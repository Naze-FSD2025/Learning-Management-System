<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<nav class="bg-purple-600 text-white shadow">
    <div class="container mx-auto px-6 py-4 flex justify-between">

        <h1 class="text-2xl font-bold">
            Learning Progress
        </h1>

        <a href="/student/dashboard"
           class="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold">
            Dashboard
        </a>

    </div>
</nav>

<div class="container mx-auto px-6 py-12">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-8">

        <h2 class="text-3xl font-bold text-gray-800 mb-6">
            Course Completion
        </h2>

        <div class="mb-4 flex justify-between">
            <span class="font-semibold text-gray-600">
                Progress
            </span>

            <span class="font-bold text-purple-600"
                  th:text="${progress + '%'}">
            </span>
        </div>

        <div class="w-full bg-gray-200 rounded-full h-6">

            <div class="bg-purple-600 h-6 rounded-full transition-all duration-500"
                 th:style="'width:' + (${progress != null ? progress : 0}) + '%'">
            </div>

        </div>

        <div class="mt-8 text-center">

            <div th:if="${progress >= 100}"
                 class="text-green-600 font-bold text-xl">
                🎉 Course Completed Successfully!
            </div>

            <div th:if="${progress < 100}"
                 class="text-gray-600">
                Keep learning. You're making great progress!
            </div>

        </div>

    </div>

</div>

</body>
</html>
